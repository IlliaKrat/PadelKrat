<style>
:root{
  --bg:#f3f6fa;--surface:#fff;--ink:#0f1b2d;--muted:#5d6b80;--line:#dde4ee;--line2:#eef2f7;
  --accent:#0a6f94;--accent-ink:#fff;--danger:#b42318;
  --one:#a4c2f4;--one-ink:#0b2a5c;
  --xiri:#6fe3f0;--xiri-ink:#053a41;
  --urb:#3c78d8;--urb-ink:#fff;
  --upv:#ea9999;--upv-ink:#4a1212;
  --ent:#7e57c2;--ent-ink:#fff;
  --occ:#d9d9d9;--occ-ink:#555;
  --free:#e4f5e6;--free-line:#8fcf93;--free-ink:#1d5a27;
  --pend:#ffe9a8;--pend-ink:#5c4300;
  --pq1:#ffa726;--pq2:#fff0d6;--pq-ink:#5a2d00;--pq-line:#e65100;
  --mine:#0a6f94;
  --shadow:0 6px 24px rgba(15,27,45,.16);
}

  --bg:#0c131d;--surface:#141d2a;--ink:#e8eef7;--muted:#97a6bb;--line:#26344a;--line2:#1c2838;

  --one:#6f95d6;--one-ink:#06152f;--xiri:#34b9c7;--xiri-ink:#021f23;--urb:#3c78d8;--urb-ink:#fff;
  --upv:#b86b6b;--upv-ink:#fff;--ent:#8a67cf;--ent-ink:#fff;--occ:#3a414c;--occ-ink:#aab2bf;
  --free:#16301c;--free-line:#3f8a4a;--free-ink:#9be3a6;--pend:#5c4a12;--pend-ink:#ffe9a8;--mine:#4cc3e6;
  --pq1:#c26a00;--pq2:#3d2a10;--pq-ink:#ffe0b2;--pq-line:#ffb74d;
  --shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131d;--surface:#141d2a;--ink:#e8eef7;--muted:#97a6bb;--line:#26344a;--line2:#1c2838;
  --accent:#4cc3e6;--accent-ink:#06222c;--danger:#ff8a80;
  --one:#6f95d6;--one-ink:#06152f;--xiri:#34b9c7;--xiri-ink:#021f23;--urb:#3c78d8;--urb-ink:#fff;
  --upv:#b86b6b;--upv-ink:#fff;--ent:#8a67cf;--ent-ink:#fff;--occ:#3a414c;--occ-ink:#aab2bf;
  --free:#16301c;--free-line:#3f8a4a;--free-ink:#9be3a6;--pend:#5c4a12;--pend-ink:#ffe9a8;--mine:#4cc3e6;
  --pq1:#c26a00;--pq2:#3d2a10;--pq-ink:#ffe0b2;--pq-line:#ffb74d;
  --shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;
  padding-inline:max(0px,env(safe-area-inset-left,0px)) max(0px,env(safe-area-inset-right,0px))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0}
.bar{flex:none;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row+.row{margin-top:8px}
.grow{flex:1;min-width:0}
.title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;margin-left:4px}
.legend{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.lg{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.notice{margin:8px 12px;padding:8px 12px;border-radius:10px;background:var(--pend);color:var(--pend-ink);font-size:13px}
/* grid */
#main{flex:1;min-height:0;overflow:auto;position:relative}
#note{flex:none}
.scroller{overflow-x:hidden;overflow-y:auto;height:100%;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wk{display:grid;grid-template-columns:28px repeat(var(--n),minmax(0,1fr));width:100%}
.wk .hd{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);border-left:1px solid var(--line2);
  text-align:center;padding:4px 0;font-size:10px;color:var(--muted);line-height:1.2;cursor:pointer}
.wk .hd b{display:block;font-size:14px;color:var(--ink);font-family:"Space Grotesk",sans-serif}
.wk .hd.today b{color:var(--accent-ink);background:var(--accent);border-radius:12px;display:inline-block;padding:0 8px}
.wk .corner{position:sticky;left:0;top:0;z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
.tm{position:sticky;left:0;z-index:5;background:var(--surface);height:calc(var(--h)*28);position:sticky}
.tm span{position:absolute;right:2px;font-size:9px;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;height:calc(var(--h)*28);border-left:1px solid var(--line2);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--line2) 1px,transparent 1px);
  background-size:100% calc(var(--h)*2),100% var(--h);background-color:var(--surface)}
.col.past{background-color:var(--bg)}
.free{position:absolute;left:1px;right:1px;border-radius:6px;background:var(--free);border:1px dashed var(--free-line);color:var(--free-ink);
  font-size:10.5px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;z-index:1}
.free{flex-direction:column;line-height:1.2}
.free *{pointer-events:none}
.free b{font-size:10.5px;font-weight:600}
.free span{font-size:9px;opacity:.85}
.free:hover{filter:brightness(.97);border-style:solid}
.ev{position:absolute;left:0;right:0;border-radius:4px;padding:1px 1px 1px 2px;overflow:hidden;font-size:9.5px;line-height:1.1;cursor:pointer;z-index:2;
  border:1px solid rgba(0,0,0,.14);text-align:left}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev b.nm{display:flex;align-items:center;gap:2px;overflow:visible}
.ev b.nm i{font-style:normal;white-space:nowrap}
.ev b.nm .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ev b.nm .bd{flex:none;padding:0 2px;border-radius:3px;background:rgba(255,255,255,.7);color:#1a1a1a;font-size:9px;line-height:11px;font-weight:700}
.ev span.tr{font-size:8px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
@media(max-width:375px){.ev span.tr{font-size:7.2px;letter-spacing:-.6px}}
.ev span{display:block;opacity:.85;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.one{background:var(--one);color:var(--one-ink)}
.ev.xiri{background:var(--xiri);color:var(--xiri-ink)}
.ev.urb{background:var(--urb);color:var(--urb-ink)}
.ev.upv{background:var(--upv);color:var(--upv-ink)}
.ev.entreno{background:var(--ent);color:var(--ent-ink)}
.ev.ocupado{background:var(--occ);color:var(--occ-ink)}
.ev.nop{background:var(--occ);color:var(--occ-ink)}
.ev.acc{border:1px dashed var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ev.pistaok{background:var(--free);color:var(--free-ink);border:2px solid var(--one)}
.ev.pistaok b,.ev.pistaok span{white-space:normal;overflow:visible;text-align:center}
.ev.pistaok{text-align:center;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ev.pistaok.half{left:50%}
.ev.canc{border:1px dashed var(--danger);box-shadow:inset 0 0 0 2px rgba(229,72,77,.35)}
.ev.pend{background:repeating-linear-gradient(45deg,var(--pq1),var(--pq1) 7px,var(--pq2) 7px,var(--pq2) 14px);color:var(--pq-ink);border:2px dashed var(--pq-line)}
.ev.pend b{text-shadow:0 0 3px var(--pq2),0 0 3px var(--pq2)}
.ev.mine{outline:2px solid var(--mine);outline-offset:-1px;z-index:3}
.nowline{position:absolute;left:0;right:0;height:2px;background:#e5484d;z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#e5484d}
/* month */
.mo{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 12px}
.mo .dn{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.mc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px;cursor:pointer;min-width:0;text-align:left}
.mc.out{opacity:.4}
.mc.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mc b{font-size:12px;font-family:"Space Grotesk",sans-serif}
.mchip{font-size:9px;line-height:1.35;border-radius:3px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(0,0,0,.1)}
.mchip.one{background:var(--one);color:var(--one-ink)}.mchip.xiri{background:var(--xiri);color:var(--xiri-ink)}.mchip.urb{background:var(--urb);color:var(--urb-ink)}.mchip.upv{background:var(--upv);color:var(--upv-ink)}.mchip.entreno{background:var(--ent);color:var(--ent-ink)}.mchip.other{background:var(--occ);color:var(--occ-ink)}.mchip.pend{background:var(--pq1);color:var(--pq-ink);border:1px dashed var(--pq-line)}
.mfree{margin-top:2px;font-size:9px;color:var(--free-ink);background:var(--free);border-radius:3px;padding:0 3px;text-align:center}
.mc{min-height:92px}
.strip{display:grid;grid-template-rows:repeat(28,1fr);height:var(--sh,64px);margin-top:3px;border-radius:4px;overflow:hidden;background:var(--line2)}
.strip i{display:block}
.s-free{background:var(--free)}.s-one{background:var(--one)}.s-xiri{background:var(--xiri)}.s-urb{background:var(--urb)}
.s-upv{background:var(--upv)}.s-entreno{background:var(--ent)}.s-ocupado,.s-nop{background:var(--occ)}.s-pend{background:var(--pq1)}.s-none{background:transparent}
.sum{padding:4px 12px 90px}
.mo{padding-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.card h3{font-size:14px;margin-bottom:6px}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 4px;text-align:left;border-bottom:1px solid var(--line2);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(5,12,22,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:var(--shadow);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:18px;margin-bottom:10px}
.f{margin-top:10px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.sheet{overflow-x:hidden}
.f input,.f select,.f textarea{min-width:0;max-width:100%;box-sizing:border-box;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px}
.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:40px}
@media(pointer:coarse){input,select,textarea{font-size:16px!important}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .grow{flex:1}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border:0;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);padding:13px 20px;font-weight:600;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:13px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}
.item:last-child{border:0}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--muted)}
.st.ok{background:var(--free);color:var(--free-ink)}.st.wait{background:var(--pend);color:var(--pend-ink)}
@keyframes slideL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.zoom{display:inline-flex;gap:4px;align-items:center}
.ov.pkov{align-items:flex-start;background:rgba(5,12,22,.25);padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;width:min(330px,calc(100vw - 24px));margin:0 auto}
.pk-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pk-d{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.pk-c{border:0;background:var(--bg);border-radius:8px;padding:9px 0;font-weight:500}
.pk-c.out{opacity:.4}.pk-c.today{box-shadow:inset 0 0 0 2px var(--accent)}
.pk-c.sel{background:var(--accent);color:var(--accent-ink)}
</style>

  var startS,durBox,place;

  function durChips(){if(!fits(st.dur))st.dur=fits(60)?60:30;return chips([[60,dur(60)],[90,dur(90)]].map(function(o){return [""+o[0],o[1]]}),""+st.dur,function(v){st.dur=+v},function(v){return !fits(+v)})}

/* solapamientos entre cosas reales (clases, UPV, entrenos) en fechas futuras */

  var today=ymd(new Date()),real=["clase","reserva","upv","entreno"],L=S.events.filter(function(e){return e.date>=today&&real.indexOf(e.type)>=0}),out=[];
  for(var i=0;i<L.length;i++)for(var j=i+1;j<L.length;j++){var a=L[i],b=L[j];if(a.date===b.date&&a.start<b.start+b.dur&&b.start<a.start+a.dur)out.push([a,b])}

var syncing=false;

/* owner: requests */

      h("div",{class:"sub",text:DOW[(d.getDay()+6)%7]+" "+d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)+" · "+tm(e.start)+"–"+tm(e.start+e.dur)})),
      h("button",{class:"btn sm pri",onclick:function(){

    var d=pd(p[0].date);
    body.appendChild(h("div",{class:"item",style:"cursor:pointer",onclick:function(){closeSheet();openEvent(p[0],false)}},h("div",{class:"grow"},
      h("b",{text:"⚠ "+evName(p[0])+" ↔ "+evName(p[1])}),
      h("div",{class:"sub",text:DOW[(d.getDay()+6)%7]+" "+d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)+" · "+tm(p[0].start)+"–"+tm(p[0].start+p[0].dur)+" / "+tm(p[1].start)+"–"+tm(p[1].start+p[1].dur)}))));
  });
  body.appendChild(h("div",{class:"acts"},h("button",{class:"btn grow",onclick:closeSheet},T("Close"))));
  sheet(T("Requests"),body);
}
/* owner: event editor */

/* ---------- servidor (Apps Script) ---------- */
function api(fn){var args=[].slice.call(arguments,1);return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args}),redirect:"follow"}).then(function(r){return r.json()}).then(function(d){if(!d.ok)throw new Error(d.err);return d.r})}
function errMsg(e){return T(String((e&&e.message)||e).replace(/^Error:\s*/,""))}
function myIds(){try{return JSON.parse(lsGet("agenda-mine","[]"))}catch(e){return []}}
function reload(){
  if(S.pw>0)return Promise.resolve();
  var sc=document.querySelector(".scroller"),top=sc?sc.scrollTop:0;
  var p=S.owner?api("getOwnerData",S.pin):api("getData");
  return p.then(function(d){
    S.mailErr=d.mailErr||"";S.events=d.events||[];var m={};(d.reqs||[]).forEach(function(r){m[r.id]={name:r.name||"",items:[r]}});S.reqs=m;S.loaded=true;S.fail=false;render();
    var s2=document.querySelector(".scroller");if(s2)s2.scrollTop=top;
  }).catch(function(e){
    if(S.owner&&/PIN/.test(errMsg(e))){S.owner=false;S.pin="";lsSet("agenda-pin","");toast(T("Wrong PIN"));return reload()}
    S.loaded=true;S.fail=true;render();
  });
}
function bg(p){S.pw=(S.pw||0)+1;return p.then(function(r){S.pw--;return r},function(er){S.pw--;toast(errMsg(er));reload();throw er})}
function saveEvent(e,id){
  var rid=id||e.id||"";
  var data={id:rid,date:e.date,start:e.start,dur:e.dur,label:e.label||"",type:e.type,place:e.place||"",court:e.court||"",status:e.status||"confirmada",notes:e.notes||"",rq:e.rq||""};
  var loc=Object.assign({},data,{id:rid||"tmp"+uid()}),i=-1;
  S.events.forEach(function(x,k){if(x.id===loc.id)i=k});
  if(i>=0)S.events[i]=Object.assign({},S.events[i],loc);else S.events.push(loc);
  render();
  return bg(api("ownerSave",S.pin,data)).then(function(nid){if(!rid)S.events.forEach(function(x){if(x.id===loc.id)x.id=nid});if(data.type!=="pista"&&S.events.some(function(x){return x.type==="pista"&&x.date===data.date}))return reload()});
}
function saveMany(list){
  var tmp=list.map(function(e){return Object.assign({},e,{id:"tmp"+uid(),label:e.label||"",court:e.court||"",notes:e.notes||"",rq:""})});
  tmp.forEach(function(x){S.events.push(x)});render();
  return bg(api("ownerSaveMany",S.pin,list.map(function(e){return {date:e.date,start:e.start,dur:e.dur,label:e.label||"",type:e.type,place:e.place||"",court:e.court||"",status:e.status||"confirmada",notes:e.notes||""}}))).then(function(){return reload()});
}
function delEvent(e){
  S.events=S.events.filter(function(x){return x.id!==e.id});render();
  return bg(api("ownerDelete",S.pin,e.id));
}
function setReqLocal(id,status){var r=S.reqs[id];if(r)(r.items||[]).forEach(function(it){it.status=status})}
function acceptReq(it){
  setReqLocal(it.id,"aceptada");
  S.events.push({id:"q"+it.id,date:it.date,start:it.start,dur:it.dur,type:"clase",place:it.place||"one",court:"",label:it.name||"",status:"aceptada",notes:"",rq:it.id});
  render();toast(T("Accepted. Book the court and mark it as confirmed."));openRequests();
  bg(api("ownerAccept",S.pin,it.id,it.place||"one")).then(function(){return reload()}).then(function(){if(document.getElementById("layer").firstChild)openRequests()}).catch(function(){});
}
function rejectReq(it){
  setReqLocal(it.id,"rechazada");render();toast(T("Rejected"));openRequests();
  bg(api("ownerReject",S.pin,it.id)).then(function(){return reload()}).catch(function(){});
}
function submitRequest(item,name){
  var req={name:name,date:item.date,start:item.start,dur:item.dur,place:item.place,note:item.note};
  api("submitRequest",req).then(function(r){var ids=myIds();ids.push(r.id);lsSet("agenda-mine",JSON.stringify(ids.slice(-30)));closeSheet();toast(T("Request sent. I will confirm the time."));reload()}).catch(function(e){toast(errMsg(e));reload()});

function openMine(){

  var STT={pendiente:[T("Waiting for confirmation"),"wait"],aceptada:[T("Time accepted · court still to book"),"wait"],confirmada:[T("Confirmed"),"ok"],rechazada:[T("Not available"),""],cancelada:[T("Cancelled"),""]};

        h("div",{class:"sub",text:dur(it.dur)+(it.place?" · "+PNAME[it.place]:"")}),h("span",{class:"st "+s[1],text:s[0]})),
        it.status==="pendiente"?h("button",{class:"btn sm dng",onclick:function(){api("cancelRequest",it.id).then(function(){toast(T("Request cancelled"));reload();openMine()})}},T("Cancel")):null))});
    body.appendChild(h("div",{class:"acts"},h("button",{class:"btn grow",onclick:closeSheet},T("Close"))));
  }).catch(function(e){body.textContent=errMsg(e)});
}
function askPin(){
  var pin=h("input",{type:"password",placeholder:"PIN",autocomplete:"current-password"});
  function go(){var v=pin.value.trim();if(!v)return;api("getOwnerData",v).then(function(){S.pin=v;S.owner=true;lsSet("agenda-pin",v);closeSheet();return reload()}).catch(function(){toast(T("Wrong PIN"))})}
  sheet(T("Coach mode"),h("div",null,field("PIN",pin),h("div",{class:"acts"},h("button",{class:"btn pri grow",onclick:go},T("Enter")),h("button",{class:"btn",onclick:closeSheet},T("Cancel")))));
}
function logout(){S.owner=false;S.pin="";lsSet("agenda-pin","");reload()}
function renderFoot(){var o=document.getElementById("foot");if(o)o.remove()}

/* ---------- init ---------- */

init();
})();
